---
layout: default
---

<div class="content">

  <h1>{{ page.title }}</h1>
  
  <ol class="image-gallery">
    {% for day in site.days %}
    {% if day.years contains page.tag %}
    <li>
      <a href="{{ day.url }}">
          <h2>{{ day.date | date: "%B %-d, %Y" }}</h2>
      </a>
    </li>
    {% endif %}
    {% endfor %}
  </ol>

</div>
