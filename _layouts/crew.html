---
layout: default
---

<h1 class="crew-h1">{{ page.name }}</h1>

<h2 class="crew-h2">{{ page.position }}</h2>

<div class="crew-content">

<table>
  <tr>
    <th class="table-header" colspan="2">{{ page.name }}</th>
  </tr>
  {% if page.image %}
  <tr>
    <td colspan="2">
        <img src="{{ page.image }}" alt="{{ page.name }}" style="width:100%">
    </td>
  </tr>
  {% endif %}
  <tr>
    <th>Position</th>
    <td>{{ page.position }}</td>
  </tr>
  <tr>
    <th>Born</th>
    <td>{{ page.born }}</td>
  </tr>
  <tr>
    <th>Died</th>
    <td>{{ page.died }}</td>
  </tr>
  <tr>
    <th>Nationality</th>
    <td>{{ page.nationality }}</td>
  </tr>
  {% if page.boat %}
  <tr>
    <th>Boat</th>
    <td>{{ page.boat }}</td>
  </tr>
  {% endif %}
</table>

<p>{{ content }}</p>

</div>

<div class="spacer"></div>
